<!DOCTYPE html>
<html>
<head>
    <title>Game Controller</title>
	<link rel="stylesheet" type="text/css" href="styles.css">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
</head>
<body>
	<h1 id="title"></h1>
	<div id="pressing" class="hidden">Pressing</div>

	<div class="button-container">
		<div class="left-button-container">
			<button id="up-left-button" class="movement diagonal controller-button" data-x="0" data-y="1"></button>
			<button id="up-right-button" class="movement diagonal controller-button" data-x="0" data-y="1"></button>
			<button id="down-left-button" class="movement diagonal controller-button" data-x="0" data-y="1"></button>
			<button id="down-right-button" class="movement diagonal controller-button" data-x="0" data-y="1"></button>
			<button id="up-button" class="movement controller-button" data-x="0" data-y="1">UP</button>
			<button id="right-button" class="movement controller-button" data-x="1" data-y="0">RIGHT</button>
			<button id="left-button" class="movement controller-button" data-x="-1" data-y="0">LEFT</button>
			<button id="down-button" class="movement controller-button" data-x="0" data-y="-1" >DOWN</button>
		</div>
		<div class="right-button-container">
			<div class="buttton-row first-row">
				<button id="melee-button" class="controller-button">MELEE</button>
				<button id="block-button" class="controller-button">BLOCK</button>
			</div>
			<div class="buttton-row second-row">
				<button id="cast-button" class="controller-button">CAST</button>
				<button id="dash-button" class="controller-button">DASH</button>
			</div>
			<div class="buttton-row third-row">
				<button id="jump-button" class="controller-button">JUMP</button>

			</div>



		</div>
	</div>

    <script>
		let lastSentTimestamp = 0;
		let latencyDisplay = document.createElement('div');
		let latencyAvgDisplay = document.createElement('div');
		document.body.appendChild(latencyDisplay);
		document.body.appendChild(latencyAvgDisplay);


		// Modified send function with timestamps
		function createMessage(commandCode) {
			const buffer = new ArrayBuffer(9); // 1 byte command + 8 bytes timestamp
			const view = new DataView(buffer);
			const timestamp = Date.now();
			view.setUint8(0, commandCode);
			view.setFloat64(1, timestamp, true); // Little-endian
			return buffer;
		}

		const buttonMapping = {
			"left-button": 0x03,   // MoveLeft
			"right-button": 0x04,  // MoveRight
			"up-button": 0x01,     // MoveUp
			"down-button": 0x02,   // MoveDown
			"melee-button": 0x0E,  // Melee
			"block-button": 0x0B,  // Parry (Blocking)
			"cast-button": 0x0C,   // SpellStart
			"dash-button": 0x0A,   // Dash
			"jump-button": 0x09,    // Jump
			"up-left-button": 0x0F, // MoveUpLeft
			"up-right-button": 0x10, // MoveUpRight
			"down-left-button": 0x11, // MoveDownLeft
			"down-right-button": 0x12, // MoveDownRight
		};


		const stopCodes = {
			"left-button": 0x07,  // StopMoveLeft
			"right-button": 0x08, // StopMoveRight
			"up-button": 0x05,    // StopMoveUp
			"down-button": 0x06,   // StopMoveDown
			"cast-button": 0x0D,   // SpellEnd
			"up-left-button": 0x13, // StopUpLeft
			"up-right-button": 0x13, // StopUpRight
			"down-left-button": 0x13, // StopDownLeft
			"down-right-button": 0x13, // StopDownRight
		};
        const socket = new WebSocket("ws://192.168.1.7:8080");

        socket.addEventListener("open", (event) => {
            console.log("Connected to Unity server!");
        });

        socket.addEventListener("error", (event) => {
            console.error("WebSocket error:", event);
        });
		
		let latency = 0;

        function send(event, command) {
			console.log(event)
			console.log(command)
            if (socket.readyState === WebSocket.OPEN) {
				console.log("sent command", command)
                socket.send("MoveLeft");
            }
        }

		let frameIds = {0: 0, 1: 0, 2: 0, 3: 0}
		function pressButton(buffer, index) {
			if (socket.readyState === WebSocket.OPEN) {
				socket.send(buffer)
			}
			frameIds[index] = requestAnimationFrame(pressButton.bind(null, buffer, index))
		}
		const pressFunction = (commandCode, index) => {
			const buffer = createMessage(commandCode);
			lastSentTimestamp = Date.now();
			if (socket.readyState === WebSocket.OPEN) {
				socket.send(buffer);
			}
			if (index >= 0 ) {
				frameIds[index] = requestAnimationFrame(() => pressFunction(commandCode, index));
			} 
		};

		const controllerButtons = document.querySelectorAll('.controller-button')
		const pressingElement = document.querySelector('.hidden')
		let downEvent = (i, event) => {
			console.log("mouse down")
			const xString = event.target.getAttribute("data-x");
			const yString = event.target.getAttribute("data-y");
			const x = parseInt(xString);
			const y = parseInt(yString);
			const code = buttonMapping[event.target.id];
			if (code === undefined) {
				return;
			}
			const buffer = new ArrayBuffer(1);
			const dataView = new DataView(buffer);

			dataView.setUint8(0, code);
			pressFunction = pressButton.bind(null, buffer, i)
			frameIds[i] = requestAnimationFrame(pressFunction);
			pressingElement.classList.remove('hidden');
		}

		downEvent = (i, event) => {
			console.log("callign this down")
			const code = buttonMapping[event.target.id];
			frameIds[i] = requestAnimationFrame(() => pressFunction(code, i));
		}


		const upEvent = (i, event) => {
			const frameId = frameIds[i]
			if (frameId) {
				console.log("cancel frame", frameId)
				cancelAnimationFrame(frameId)
				stopCode = stopCodes[event.target.id];
				if (stopCode === undefined) {
					return;
				}

				pressFunction(stopCode, -1)
				return

				const buffer = new ArrayBuffer(1);
				const dataView = new DataView(buffer);
				dataView.setUint8(0, stopCode);

				if (socket.readyState === WebSocket.OPEN) {
					socket.send(buffer);
					pressingElement.classList.add('hidden');
				}
			}
		}
		controllerButtons.forEach((button, i) => {
			downEventBind = downEvent.bind(this, i)
			upEventBind = upEvent.bind(this, i)
			button.addEventListener('mousedown', downEventBind)
			button.addEventListener('mouseup', upEventBind);
			button.addEventListener('touchstart', downEventBind);
			button.addEventListener('touchend', upEventBind);
		}) 

		const latencyList = []
		let latencyIndex = 0
		socket.addEventListener('message', (event) => {
			if (typeof event.data === 'string') {
				latency = (Date.now() - parseInt(event.data)) / 2;
				if (latencyList.length < 100) {
					latencyList.push(latency);
				}
				else {
					latencyList[latencyIndex] = latency
					latencyIndex = (latencyIndex + 1) % 100
				}
				const latencyAvg = Math.round(latencyList.reduce((acc, curr) => acc + curr) / latencyList.length * 100) / 100


				latencyDisplay.textContent = `Last command latency: ${latency}ms`;
				latencyAvgDisplay.textContent = `Latency Avg (last 100 commands): ${latencyAvg}`;
			}
		});

    </script>
</body>
</html>
